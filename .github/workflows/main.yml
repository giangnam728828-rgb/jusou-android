name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/in-app-search-navigation

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e

          if [ ! -f jusou-android-project.zip ]; then
            echo "ERROR: jusou-android-project.zip not found"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted www
          unzip -oq jusou-android-project.zip -d extracted

          INDEX_PATH="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found inside ZIP"
            echo "Files extracted from ZIP:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          WEB_DIR="$(dirname "$INDEX_PATH")"
          echo "Website entry: $INDEX_PATH"

          cp -a "$WEB_DIR"/. www/

      - name: Bake AI service config
        env:
          AI_API_URL: ${{ secrets.AI_API_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_VISION_MODEL: ${{ secrets.AI_VISION_MODEL }}
        run: |
          set -e

          AI_FILE="$(find www -type f -name ai.html -print -quit)"
          if [ -z "$AI_FILE" ]; then
            echo "ERROR: ai.html not found in www"
            exit 1
          fi

          python3 - "$AI_FILE" <<'PY2'
          import os
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8")

          url = os.environ.get("AI_API_URL", "").strip()
          key = os.environ.get("AI_API_KEY", "").strip()
          model = os.environ.get("AI_MODEL", "").strip()
          vision = os.environ.get("AI_VISION_MODEL", "").strip()

          # 支持只填基础地址，自动补全 /chat/completions
          if url and not url.rstrip("/").endswith("chat/completions"):
              url = url.rstrip("/") + "/chat/completions"

          s = s.replace("__PROXY_URL__", url)
          s = s.replace("__APP_TOKEN__", key)
          s = s.replace("__MODEL__", model)
          s = s.replace("__VISION_MODEL__", vision)
          p.write_text(s, encoding="utf-8")
          print("AI config baked | url:", "set" if url else "EMPTY", "| key:", "set" if key else "EMPTY", "| model:", model or "server default", "| vision:", vision or "none")
          PY2

      - name: Inspect search navigation source
        run: |
          echo "=== Navigation-related matches ==="
          grep -RniE 'JUSOU_NATIVE_OPEN|function openUrl|function open\(|Browser\.open' www || true
          echo "=== index.html around openUrl ==="
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(errors="replace")
          for key in ["function openUrl", "function open(", "JUSOU_NATIVE_OPEN"]:
              i = s.find(key)
              if i >= 0:
                  print("\n---", key, "---")
                  print(s[max(0, i-500):i+1800])
          PY
          echo "=== bridge files ==="
          find www -type f \( -name '*bridge*' -o -name '*capacitor*' \) -print

          echo "=== 查找清空按钮的真实位置 ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path("www/index.html").read_text(
              encoding="utf-8",
              errors="replace"
          )

          for m in re.finditer("清空", s):
              i = m.start()
              print("\n--- 清空按钮附近的 HTML ---")
              print(s[max(0, i-350):i+350])
          PY

      - name: Replace external browser bridge
        run: |
          set -e
          cat > www/app-bridge.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { InAppBrowser, DefaultWebViewOptions } from '@capacitor/inappbrowser';

          if (Capacitor.isNativePlatform()) {
            window.JUSOU_NATIVE_OPEN = async (url) => {
              if (!url) return;

              try {
                const parsed = new URL(url);
                if (!['https:', 'http:'].includes(parsed.protocol)) return;

                await InAppBrowser.openInWebView({
                  url: parsed.href,
                  options: DefaultWebViewOptions
                });
              } catch (e) {
                console.error('聚搜打开站内浏览页失败', e);
              }
            };
          }
          EOF

      - name: Apply modern UI redesign
        run: |
          set -e

          cat > www/ui-redesign.css <<'CSS'
          :root {
            color-scheme: light;
            --bg: #eef1fb;
            --card: #ffffff;
            --txt: #1c2338;
            --sub: #6f7a93;
            --acc: #4f6bf6;
            --acc2: #8a5cf7;
            --line: rgba(110, 125, 170, .20);
            --hair: rgba(110, 125, 170, .18);
            --b1: rgba(96, 130, 255, .55);
            --b2: rgba(190, 120, 255, .45);
            --b3: rgba(80, 205, 255, .40);
            --b4: rgba(255, 140, 190, .36);
            --g-bg: linear-gradient(135deg, rgba(255, 255, 255, .66), rgba(255, 255, 255, .32));
            --g-line: rgba(255, 255, 255, .72);
            --g-rim: inset 0 1px 1px rgba(255, 255, 255, .95), inset 0 -1px 1px rgba(255, 255, 255, .35), inset 0 0 14px rgba(255, 255, 255, .22);
            --g-drop: 0 10px 30px rgba(52, 70, 140, .16);
            --g-blur: blur(22px) saturate(185%);
            --sheet-bg: rgba(255, 255, 255, .78);
            --field: rgba(255, 255, 255, .55);
            --plate: #ffffff;
            --fs: 1;
            --lift: max(env(safe-area-inset-bottom, 0px), 14px);
          }

          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0b0f1a;
            --card: #171e30;
            --txt: #edf1ff;
            --sub: #9aa6c0;
            --acc: #8ea2ff;
            --acc2: #b194ff;
            --line: rgba(255, 255, 255, .12);
            --hair: rgba(255, 255, 255, .10);
            --b1: rgba(60, 90, 255, .42);
            --b2: rgba(140, 70, 255, .34);
            --b3: rgba(30, 160, 220, .26);
            --b4: rgba(230, 70, 150, .24);
            --g-bg: linear-gradient(135deg, rgba(255, 255, 255, .15), rgba(255, 255, 255, .05));
            --g-line: rgba(255, 255, 255, .17);
            --g-rim: inset 0 1px 1px rgba(255, 255, 255, .28), inset 0 -1px 1px rgba(255, 255, 255, .05), inset 0 0 14px rgba(255, 255, 255, .04);
            --g-drop: 0 12px 32px rgba(0, 0, 0, .45);
            --sheet-bg: rgba(24, 30, 48, .80);
            --field: rgba(255, 255, 255, .08);
            --plate: #ffffff;
          }

          /* ---------- 背景：彩色光斑，让玻璃有东西可以折射 ---------- */
          html {
            background: var(--bg) !important;
            scroll-behavior: smooth;
          }

          body {
            background: transparent !important;
            color: var(--txt) !important;
            padding-bottom: 0 !important;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
              "Noto Sans SC", "Microsoft YaHei", sans-serif;
          }

          body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
              radial-gradient(60% 38% at 12% 6%, var(--b1), transparent 70%),
              radial-gradient(55% 36% at 92% 14%, var(--b2), transparent 70%),
              radial-gradient(70% 40% at 80% 78%, var(--b3), transparent 72%),
              radial-gradient(60% 36% at 6% 90%, var(--b4), transparent 72%);
          }

          .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 18px 16px calc(var(--lift) + 112px) !important;
          }

          /* ---------- 顶部：居中品牌 + 大搜索框（类似 Chrome 新标签页） ---------- */
          header {
            position: relative;
            text-align: center;
          }

          .brand {
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            margin-bottom: 4px;
          }

          .logo {
            width: 64px;
            height: 64px;
            border-radius: 21px !important;
            font-size: 28px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55), 0 10px 24px rgba(79, 107, 246, .32);
          }

          .brand h1, h1 {
            color: var(--txt) !important;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
          }

          .sub {
            margin: 2px 0 20px !important;
            color: var(--sub) !important;
            font-size: 12.5px;
            text-align: center;
          }

          .theme-toggle {
            position: absolute;
            top: calc(env(safe-area-inset-top, 0px) + 22px);
            right: 0;
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            padding: 0;
            border: 1px solid var(--g-line);
            border-radius: 50%;
            background: var(--g-bg);
            -webkit-backdrop-filter: var(--g-blur);
            backdrop-filter: var(--g-blur);
            box-shadow: var(--g-rim), var(--g-drop);
            color: var(--txt);
            font-size: 20px;
          }

          .bar {
            max-width: 600px;
            height: 58px !important;
            margin: 0 auto;
            padding: 0 7px 0 8px !important;
            gap: 6px;
            border: 1px solid var(--g-line) !important;
            border-radius: 999px !important;
            background: var(--g-bg) !important;
            -webkit-backdrop-filter: var(--g-blur);
            backdrop-filter: var(--g-blur);
            box-shadow: var(--g-rim), var(--g-drop) !important;
          }

          .engbtn {
            height: 44px;
            border-radius: 999px;
          }

          .engbtn em {
            width: 34px;
            height: 34px;
            border-radius: 12px;
          }

          .engbtn em img {
            border-radius: 12px;
            background: #fff !important;
          }

          #kw {
            min-width: 0;
            flex: 1;
            height: 100%;
            padding: 0 6px !important;
            border: 0 !important;
            outline: none;
            background: transparent !important;
            color: var(--txt) !important;
            font-size: 16px;
            box-shadow: none !important;
          }

          .bar .clr {
            background: var(--hair);
          }

          .go {
            height: 44px;
            padding: 0 20px;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--acc), var(--acc2)) !important;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .45), 0 6px 16px rgba(110, 100, 240, .38);
          }

          /* ---------- 搜索历史、分类标签：玻璃胶囊 ---------- */
          .chip, .tab, .scat {
            border: 1px solid var(--g-line);
            background: var(--g-bg);
            box-shadow: var(--g-rim);
            color: var(--sub);
          }

          .tab.act, .scat.on {
            border-color: transparent;
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .4), 0 6px 14px rgba(110, 100, 240, .30);
            color: #fff;
            font-weight: 700;
          }

          /* “清空”按钮：原页面把搜索框的 .clr（28px 圆形）也套在了它身上，导致文字被圆形裁掉 */
          .hist .chip.clr {
            display: inline-flex;
            align-items: center;
            width: auto;
            height: auto;
            min-width: 0;
            padding: 5px 13px;
            border: 1px dashed var(--acc);
            border-radius: 999px;
            background: transparent;
            box-shadow: none;
            color: var(--acc);
            font-weight: 600;
          }

          .tabs {
            margin: 18px 0 12px;
            padding: 2px 0 6px;
          }

          .tab {
            padding: 7px 14px;
          }

          .tools {
            margin: 4px 0 14px;
          }

          .addbtn {
            border: 1px solid var(--g-line);
            background: var(--g-bg);
            box-shadow: var(--g-rim);
            color: var(--acc);
          }

          /* ---------- 站点：图标 + 文字（类似 Chrome 的快捷方式） ---------- */
          .grid {
            display: grid !important;
            grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            gap: 16px 6px !important;
          }

          .card {
            min-width: 0;
            gap: 8px;
            padding: 6px 2px 2px !important;
            border: 0 !important;
            border-radius: 18px;
            background: none !important;
            box-shadow: none !important;
            color: var(--txt) !important;
          }

          .card:active {
            transform: scale(.94);
          }

          .ico {
            width: 58px;
            height: 58px;
            overflow: hidden;
            border: 0 !important;
            border-radius: 19px !important;
            box-shadow: var(--g-drop);
          }

          .ico img {
            padding: 10px;
            border-radius: 19px;
            background: var(--plate) !important;
          }

          .ico::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: linear-gradient(160deg, rgba(255, 255, 255, .50), rgba(255, 255, 255, 0) 46%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .9), inset 0 0 0 1px rgba(255, 255, 255, .35);
            pointer-events: none;
          }

          /* 图标加载失败时显示的文字（站点自带的彩色底 + 白字） */
          .ico em {
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .22);
          }

          .nm {
            width: 100%;
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
            color: var(--txt) !important;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.35;
          }

          .nm small {
            color: var(--sub) !important;
            font-size: 10.5px;
            font-weight: 400;
          }

          .star {
            top: 0;
            right: 4px;
            font-size: 14px;
            color: rgba(110, 125, 170, .45);
          }

          .star.on {
            color: #ffb300;
          }

          .card.ovs::after {
            top: 0;
            left: 4px;
          }

          .del {
            top: 0;
          }

          .edit {
            bottom: 22px;
          }

          /* ---------- 设置页、弹窗 ---------- */
          #settings {
            padding: 0 16px;
            border: 1px solid var(--g-line);
            border-radius: 24px;
            background: var(--g-bg);
            -webkit-backdrop-filter: var(--g-blur);
            backdrop-filter: var(--g-blur);
            box-shadow: var(--g-rim), var(--g-drop);
          }

          .mitem {
            border-bottom: 1px solid var(--hair);
            background: transparent;
            color: var(--txt);
          }

          .mask {
            background: rgba(20, 28, 60, .30);
            -webkit-backdrop-filter: blur(6px);
            backdrop-filter: blur(6px);
          }

          .sheet {
            border: 1px solid var(--g-line);
            border-bottom: 0;
            border-radius: 28px 28px 0 0;
            background: var(--sheet-bg);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            backdrop-filter: blur(30px) saturate(190%);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .7);
            color: var(--txt);
          }

          .ipt, .bk {
            border: 1px solid var(--g-line);
            background: var(--field);
            color: var(--txt);
          }

          .acts button {
            border-radius: 999px;
          }

          .acts .c {
            border: 1px solid var(--g-line);
            background: var(--g-bg);
            box-shadow: var(--g-rim);
            color: var(--sub);
          }

          .acts .s {
            background: linear-gradient(135deg, var(--acc), var(--acc2));
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .45), 0 6px 16px rgba(110, 100, 240, .36);
          }

          /* ---------- 底部导航：iOS 风格玻璃胶囊 + 图标 ---------- */
          .tabbar {
            z-index: 8;
            right: 18px;
            bottom: calc(var(--lift) + 8px);
            left: 18px;
            max-width: 420px;
            margin: 0 auto;
            padding: 6px !important;
            gap: 2px;
            border: 1px solid var(--g-line);
            border-radius: 30px;
            background: var(--g-bg);
            -webkit-backdrop-filter: var(--g-blur);
            backdrop-filter: var(--g-blur);
            box-shadow: var(--g-rim), var(--g-drop);
          }

          .tb {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            height: auto;
            min-height: 52px;
            min-width: 0;
            padding: 6px 2px;
            border-radius: 24px;
            color: var(--sub);
            font-size: 11px;
            transition: background .2s, color .2s;
          }

          /* 修复：导航图标已直接内联在各按钮的 <svg> 里，禁用旧的 ::before 遮罩方案。
             旧方案给 AI 项漏定义了 --ic，遮罩失效后 background:currentColor
             会渲染成一坨 22x22 的实心色块（AI 图标上方纯色 bug 的根源） */
          .tb::before {
            content: none !important;
          }

          .tb svg {
            display: block;
            width: 22px;
            height: 22px;
            flex: 0 0 auto;
          }

          .tb.on {
            background: linear-gradient(135deg, rgba(255, 255, 255, .78), rgba(255, 255, 255, .36));
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .95), 0 4px 14px rgba(79, 107, 246, .20);
            color: var(--acc);
            font-weight: 700;
          }

          :root[data-theme="dark"] .tb.on {
            background: linear-gradient(135deg, rgba(255, 255, 255, .20), rgba(255, 255, 255, .08));
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, .30), 0 4px 14px rgba(0, 0, 0, .30);
          }

          /* ---------- 返回顶部、提示条 ---------- */
          .top {
            bottom: calc(var(--lift) + 92px);
            border: 1px solid var(--g-line);
            background: var(--g-bg);
            -webkit-backdrop-filter: var(--g-blur);
            backdrop-filter: var(--g-blur);
            box-shadow: var(--g-rim), var(--g-drop);
          }

          .toast {
            bottom: calc(var(--lift) + 92px);
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(22, 26, 44, .74);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
          }

          ::placeholder {
            color: var(--sub) !important;
            opacity: .8;
          }

          @media (min-width: 520px) {
            .grid {
              grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            }
          }

          @media (min-width: 700px) {
            .grid {
              grid-template-columns: repeat(6, minmax(0, 1fr)) !important;
            }
          }

          /* ---------- 字体大小（设置里可调）。放在最后，覆盖前面的固定字号 ---------- */
          .brand h1, h1 { font-size: calc(26px * var(--fs)); }
          .sub { font-size: calc(12.5px * var(--fs)); }
          #kw { font-size: calc(16px * var(--fs)); }
          .go { font-size: calc(15px * var(--fs)); }
          .tab { font-size: calc(12.5px * var(--fs)); }
          .chip { font-size: calc(12px * var(--fs)); }
          #cnt { font-size: calc(12px * var(--fs)); }
          .addbtn { font-size: calc(13px * var(--fs)); }
          .nm { font-size: calc(12px * var(--fs)); }
          .nm small { font-size: calc(10.5px * var(--fs)); }
          .mitem { font-size: calc(14px * var(--fs)); }
          .mitem span { font-size: calc(12px * var(--fs)); }
          .tb { font-size: calc(11px * var(--fs)); }
          .hint { font-size: calc(11px * var(--fs)); }
          .hint.on { height: calc(17px * var(--fs)); }
          .hist.on { height: calc(31px * var(--fs)); }
          .tip { font-size: calc(11px * var(--fs)); }
          .help { font-size: calc(13px * var(--fs)); }
          .sheet h3 { font-size: calc(16px * var(--fs)); }
          .acts button { font-size: calc(15px * var(--fs)); }
          .scat { font-size: calc(12px * var(--fs)); }
          .ipt { font-size: calc(14px * var(--fs)); }
          footer { font-size: calc(11px * var(--fs)); }
          CSS

          cat > www/ui-redesign.js <<'JS'
          (() => {
            const root = document.documentElement;
            const THEME_KEY = 'jusou_theme';
            const FS_KEY = 'jusou_fs';
            const BUILD = {
              version: '__BUILD_VER__',
              code: '__BUILD_CODE__',
              date: '__BUILD_DATE__',
              sha: '__BUILD_SHA__'
            };
            const LEVELS = [
              { name: '小', value: 0.9 },
              { name: '标准', value: 1 },
              { name: '大', value: 1.15 },
              { name: '特大', value: 1.3 }
            ];

            function readStore(key) {
              try {
                return localStorage.getItem(key);
              } catch (_) {
                return null;
              }
            }

            function writeStore(key, value) {
              try {
                localStorage.setItem(key, value);
              } catch (_) {}
            }

            function esc(s) {
              return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              }[c]));
            }

            /* ---------- 主题 ---------- */
            function applyTheme(theme) {
              root.dataset.theme = theme;
              const button = document.getElementById('theme-toggle');

              if (button) {
                button.textContent = theme === 'dark' ? '☀' : '☾';
                button.setAttribute(
                  'aria-label',
                  theme === 'dark' ? '切换浅色模式' : '切换深色模式'
                );
                button.title = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
              }

              const meta = document.querySelector('meta[name="theme-color"]');
              if (meta) {
                meta.content = theme === 'dark' ? '#0b0f1a' : '#eef1fb';
              }
            }

            applyTheme(readStore(THEME_KEY) || 'light');

            function addToggle() {
              const brand = document.querySelector('.brand');
              if (!brand || document.getElementById('theme-toggle')) return;

              const button = document.createElement('button');
              button.id = 'theme-toggle';
              button.className = 'theme-toggle';
              button.type = 'button';
              button.textContent = '☾';
              button.title = '切换主题';
              button.setAttribute('aria-label', '切换深色模式');

              button.addEventListener('click', () => {
                const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                writeStore(THEME_KEY, next);
              });

              brand.appendChild(button);
              applyTheme(root.dataset.theme || 'light');
            }

            /* ---------- 字体大小 ---------- */
            function getFs() {
              const v = parseFloat(readStore(FS_KEY));
              return LEVELS.some((l) => l.value === v) ? v : 1;
            }

            function fsName(v) {
              const hit = LEVELS.find((l) => l.value === v);
              return hit ? hit.name : '标准';
            }

            function applyFs(v) {
              root.style.setProperty('--fs', String(v));
              const el = document.getElementById('fs-val');
              if (el) el.textContent = fsName(v);
            }

            applyFs(getFs());

            /* ---------- 设置页：字体大小 + 应用信息 ---------- */
            function openMask(id) {
              const m = document.getElementById(id);
              if (m) m.classList.add('on');
            }

            function closeMask(id) {
              const m = document.getElementById(id);
              if (m) m.classList.remove('on');
            }

            function renderFsList() {
              const cur = getFs();
              document.getElementById('fslist').innerHTML = LEVELS.map((l) =>
                '<div class="mitem" data-fs="' + l.value + '">' + esc(l.name) +
                '<span>' + (l.value === cur ? '当前' : '') + '</span></div>'
              ).join('');
            }

            function renderInfoList() {
              const ua = navigator.userAgent || '';
              const android = (ua.match(/Android ([\d.]+)/) || [])[1];
              const chrome = (ua.match(/Chrome\/([\d.]+)/) || [])[1];
              const cap = window.Capacitor;
              const isApp = !!(cap && (cap.isNativePlatform ? cap.isNativePlatform() : cap.isNative));
              const aboutEl = document.getElementById('aboutv');
              const sites = aboutEl ? aboutEl.textContent.replace(/^共\s*/, '') : '';
              const rows = [
                ['应用名称', '聚搜'],
                ['版本', BUILD.version],
                ['版本号', BUILD.code],
                ['构建日期', BUILD.date],
                ['代码提交', BUILD.sha],
                ['运行方式', isApp ? 'App' : '网页'],
                ['系统', android ? 'Android ' + android : '未知'],
                ['内核', chrome ? 'Chrome ' + chrome : '未知'],
                ['站点数量', sites || '未知'],
                ['数据存储', '仅保存在本机']
              ];
              document.getElementById('infolist').innerHTML = rows.map((r) =>
                '<div class="mitem">' + esc(r[0]) + '<span>' + esc(r[1]) + '</span></div>'
              ).join('');
            }

            function buildSheets() {
              if (document.getElementById('fsmask')) return;

              const fs = document.createElement('div');
              fs.className = 'mask';
              fs.id = 'fsmask';
              fs.innerHTML =
                '<div class="sheet"><h3>字体大小</h3><div id="fslist"></div>' +
                '<div class="acts"><button class="c" id="fsclose" type="button">关闭</button></div></div>';

              const info = document.createElement('div');
              info.className = 'mask';
              info.id = 'infomask';
              info.innerHTML =
                '<div class="sheet"><h3>应用信息</h3><div id="infolist"></div>' +
                '<div class="acts"><button class="s" id="infoclose" type="button">知道了</button></div></div>';

              document.body.appendChild(fs);
              document.body.appendChild(info);

              fs.addEventListener('click', (e) => {
                if (e.target === fs) closeMask('fsmask');
              });
              info.addEventListener('click', (e) => {
                if (e.target === info) closeMask('infomask');
              });
              document.getElementById('fsclose').addEventListener('click', () => closeMask('fsmask'));
              document.getElementById('infoclose').addEventListener('click', () => closeMask('infomask'));
              document.getElementById('fslist').addEventListener('click', (e) => {
                const item = e.target.closest('.mitem');
                if (!item) return;
                const v = parseFloat(item.dataset.fs);
                applyFs(v);
                writeStore(FS_KEY, String(v));
                renderFsList();
              });
            }

            function addRows() {
              const set = document.getElementById('settings');
              if (!set || document.getElementById('fs-row')) return;

              const fsRow = document.createElement('div');
              fsRow.className = 'mitem';
              fsRow.id = 'fs-row';
              fsRow.innerHTML = '字体大小<span id="fs-val">' + esc(fsName(getFs())) + '</span>';

              const infoRow = document.createElement('div');
              infoRow.className = 'mitem';
              infoRow.id = 'info-row';
              infoRow.innerHTML = '应用信息<span>' + esc(BUILD.version) + '</span>';

              if (set.firstElementChild) {
                set.firstElementChild.after(fsRow);
              } else {
                set.appendChild(fsRow);
              }
              set.appendChild(infoRow);

              set.addEventListener('click', (e) => {
                const item = e.target.closest('.mitem');
                if (!item) return;
                if (item.id === 'fs-row') {
                  renderFsList();
                  openMask('fsmask');
                } else if (item.id === 'info-row') {
                  renderInfoList();
                  openMask('infomask');
                }
              });
            }

            function setup() {
              addToggle();
              buildSheets();
              addRows();
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', setup);
            } else {
              setup();
            }
          })();
          JS

          RUN_NO="${GITHUB_RUN_NUMBER:-1}"
          sed -i "s/__BUILD_VER__/1.1.${RUN_NO}/; s/__BUILD_CODE__/$((RUN_NO + 2))/; s/__BUILD_DATE__/$(date -u +%Y-%m-%d)/; s/__BUILD_SHA__/${GITHUB_SHA::7}/" www/ui-redesign.js

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          if not p.exists():
              raise SystemExit("ERROR: www/index.html not found")

          html = p.read_text(encoding="utf-8")

          css = '<link rel="stylesheet" href="ui-redesign.css">'
          js = '<script src="ui-redesign.js"></script>'
          meta = '<meta name="referrer" content="no-referrer">'

          if css not in html:
              pos = html.lower().rfind("</head>")
              if pos < 0:
                  raise SystemExit("ERROR: cannot find </head> in index.html")
              html = html[:pos] + css + "\n" + html[pos:]

          # 站点图标请求不带 Referer，避免被图标所在网站的防盗链拦截
          if meta not in html:
              html, n = re.subn(
                  r"<head[^>]*>",
                  lambda m: m.group(0) + "\n" + meta,
                  html,
                  count=1,
                  flags=re.I
              )
              if n != 1:
                  print("WARN: <head> not found, referrer meta not added")

          # 图标加载顺序里补充 apple-touch-icon 作为备用来源
          extra = (
              'out.push(o.origin+"/apple-touch-icon.png");'
              'if(root!==host)out.push(b+root+"/apple-touch-icon.png");'
          )
          html, n = re.subn(
              r'(out\.push\(b\+root\+"/favicon\.png"\);\s*)return out;',
              lambda m: m.group(1) + extra + "\n  return out;",
              html,
              count=1
          )
          if n != 1:
              print("WARN: favSrcs not found, extra icon sources not added")

          if js not in html:
              pos = html.lower().rfind("</body>")
              if pos < 0:
                  raise SystemExit("ERROR: cannot find </body> in index.html")
              html = html[:pos] + js + "\n" + html[pos:]

          p.write_text(html, encoding="utf-8")
          print("Modern UI redesign applied.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        env:
          JUSOU_KEYSTORE_BASE64: ${{ secrets.JUSOU_KEYSTORE_BASE64 }}
          JUSOU_KEYSTORE_PASSWORD: ${{ secrets.JUSOU_KEYSTORE_PASSWORD }}
          JUSOU_KEY_PASSWORD: ${{ secrets.JUSOU_KEY_PASSWORD }}
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/inappbrowser@2.5.5
          npm install --save-dev esbuild
          npx esbuild www/app-bridge.js --bundle --format=esm --platform=browser --outfile=www/app-bridge.bundle.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          new = 'src="/app-bridge.bundle.js"'
          s, count = re.subn(r'''src=(["'])/?app-bridge\.js\1''', new, s)
          if count == 0:
              tag = '<script type="module" src="/app-bridge.bundle.js"></script>'
              if "</head>" in s:
                  s = s.replace("</head>", tag + "</head>", 1)
              else:
                  s = tag + s
              print("index.html 中没有找到 app-bridge.js 引用，已自动插入打包后的脚本")
          else:
              print("已切换到打包后的 app-bridge.bundle.js")
          p.write_text(s, encoding="utf-8")
          PY
          npx cap init "聚搜" com.jusou.app --web-dir=www
          npx cap add android

          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path
          import re

          encoded = os.environ.get("JUSOU_KEYSTORE_BASE64", "").strip()
          store_pass = os.environ.get("JUSOU_KEYSTORE_PASSWORD", "")
          key_pass = os.environ.get("JUSOU_KEY_PASSWORD", "")

          if not encoded or not store_pass or not key_pass:
              raise SystemExit("ERROR: signing secrets are missing")

          try:
              keystore = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("ERROR: keystore Base64 is invalid")

          if len(keystore) < 100:
              raise SystemExit("ERROR: keystore file is too small")

          Path("android/app/jusou-release.jks").write_bytes(keystore)

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "jusouFixed" in s:
              raise SystemExit("ERROR: signing configuration already exists")

          signing = '''
              signingConfigs {
                  jusouFixed {
                      storeFile file("jusou-release.jks")
                      storePassword System.getenv("JUSOU_KEYSTORE_PASSWORD")
                      keyAlias "jusou"
                      keyPassword System.getenv("JUSOU_KEY_PASSWORD")
                  }
              }
          '''

          s, n = re.subn(
              r'\bandroid\s*\{',
              lambda m: m.group(0) + signing,
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("ERROR: android block not found")

          s, n = re.subn(
              r'(\bbuildTypes\s*\{)',
              r'\1\n        debug {\n            signingConfig signingConfigs.jusouFixed\n        }\n',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("ERROR: buildTypes block not found")

          p.write_text(s, encoding="utf-8")
          print("Persistent APK signing configured.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          s = p.read_text(encoding="utf-8")

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          next_code = run_number + 2
          next_name = f"1.1.{run_number}"

          s, code_count = re.subn(
              r'\bversionCode\s+\d+',
              f'versionCode {next_code}',
              s,
              count=1
          )

          s, name_count = re.subn(
              r'\bversionName\s+["\'][^"\']*["\']',
              f'versionName "{next_name}"',
              s,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "ERROR: 无法自动修改版本号，请检查 android/app/build.gradle"
              )

          p.write_text(s, encoding="utf-8")
          print(f"App version updated to {next_name} (versionCode {next_code})")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()
          s, count = re.subn(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 26',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("ERROR: 无法定位 minSdkVersion，请检查 android/variables.gradle")
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          JUSOU_KEYSTORE_PASSWORD: ${{ secrets.JUSOU_KEYSTORE_PASSWORD }}
          JUSOU_KEY_PASSWORD: ${{ secrets.JUSOU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jusou-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
