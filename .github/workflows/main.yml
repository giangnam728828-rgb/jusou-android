name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/in-app-search-navigation

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e

          if [ ! -f jusou-android-project.zip ]; then
            echo "ERROR: jusou-android-project.zip not found"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted www
          unzip -oq jusou-android-project.zip -d extracted

          INDEX_PATH="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found inside ZIP"
            echo "Files extracted from ZIP:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          WEB_DIR="$(dirname "$INDEX_PATH")"
          echo "Website entry: $INDEX_PATH"

          cp -a "$WEB_DIR"/. www/

      - name: Inspect search navigation source
        run: |
          echo "=== Navigation-related matches ==="
          grep -RniE 'JUSOU_NATIVE_OPEN|function openUrl|function open\(|Browser\.open' www || true
          echo "=== index.html around openUrl ==="
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(errors="replace")
          for key in ["function openUrl", "function open(", "JUSOU_NATIVE_OPEN"]:
              i = s.find(key)
              if i >= 0:
                  print("\n---", key, "---")
                  print(s[max(0, i-500):i+1800])
          PY
          echo "=== bridge files ==="
          find www -type f \( -name '*bridge*' -o -name '*capacitor*' \) -print

      - name: Replace external browser bridge
        run: |
          set -e
          cat > www/app-bridge.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { InAppBrowser, DefaultWebViewOptions } from '@capacitor/inappbrowser';

          if (Capacitor.isNativePlatform()) {
            window.JUSOU_NATIVE_OPEN = async (url) => {
              if (!url) return;

              try {
                const parsed = new URL(url);
                if (!['https:', 'http:'].includes(parsed.protocol)) return;

                await InAppBrowser.openInWebView({
                  url: parsed.href,
                  options: DefaultWebViewOptions
                });
              } catch (e) {
                console.error('聚搜打开站内浏览页失败', e);
              }
            };
          }
          EOF

      - name: Apply modern UI redesign
        run: |
          set -e

          cat > www/ui-redesign.css <<'CSS'
          :root {
            color-scheme: light;
            --bg: #f5f7fb;
            --card: #ffffff;
            --txt: #192238;
            --sub: #748096;
            --line: #e5eaf2;
            --acc: #4263eb;
            --shadow: 0 5px 20px rgba(30, 45, 80, .06);
          }

          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #10131a;
            --card: #191e28;
            --txt: #f0f3fa;
            --sub: #9ba6ba;
            --line: #2b3342;
            --acc: #8299ff;
            --shadow: 0 5px 20px rgba(0, 0, 0, .15);
          }

          html {
            background: var(--bg);
          }

          body {
            background: var(--bg) !important;
            color: var(--txt) !important;
            transition: background .2s, color .2s;
          }

          .page {
            max-width: 760px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
          }

          header, .brand {
            color: var(--txt) !important;
          }

          .brand {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 10px;
          }

          .brand > h1 {
            margin-right: auto;
          }

          .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
          }

          .logo {
            border-radius: 14px !important;
            box-shadow: 0 5px 14px rgba(66, 99, 235, .22);
          }

          h1, h2, h3, p, label {
            color: var(--txt);
          }

          .theme-toggle {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--card);
            color: var(--txt);
            font-size: 21px;
          }

          input, select, textarea, .bar, .ipt {
            background: var(--card) !important;
            color: var(--txt) !important;
            border-color: var(--line) !important;
            border-radius: 15px !important;
          }

          .bar {
            box-shadow: var(--shadow);
          }

          .go, button.primary {
            border-radius: 14px;
          }

          .chip, .tabs, .card, .mitem, .sheet,
          .tabbar, .tb {
            color: var(--txt);
          }

          .chip, .card, .mitem, .sheet {
            background: var(--card) !important;
            border-color: var(--line) !important;
            box-shadow: var(--shadow);
          }

          .grid {
            gap: 12px;
          }

          .card {
            border-radius: 18px !important;
            transition: transform .15s;
          }

          .card:active, .chip:active {
            transform: scale(.98);
          }

          .nm {
            color: var(--txt) !important;
          }

          .tabbar {
            background: var(--card) !important;
            border-color: var(--line) !important;
          }

          .sub, .desc, .hint, .nm small {
            color: var(--sub) !important;
          }

          .mask {
            background: rgba(10, 15, 28, .48);
          }

          ::placeholder {
            color: var(--sub) !important;
            opacity: .8;
          }

          button {
            cursor: pointer;
          }

          @media (max-width: 480px) {
            .page {
              padding-left: 14px;
              padding-right: 14px;
            }

            .grid {
              gap: 10px;
            }
          }
          CSS

          cat > www/ui-redesign.js <<'JS'
          (() => {
            const root = document.documentElement;
            const key = 'jusou_theme';

            function applyTheme(theme) {
              root.dataset.theme = theme;
              const button = document.getElementById('theme-toggle');
              if (button) {
                button.textContent = theme === 'dark' ? '☀' : '☾';
                button.setAttribute(
                  'aria-label',
                  theme === 'dark' ? '切换浅色模式' : '切换深色模式'
                );
              }
              const meta = document.querySelector('meta[name="theme-color"]');
              if (meta) {
                meta.content = theme === 'dark' ? '#10131a' : '#f5f7fb';
              }
            }

            let saved = 'light';
            try {
              saved = localStorage.getItem(key) || 'light';
            } catch (_) {}
            applyTheme(saved);

            function addToggle() {
              const brand = document.querySelector('.brand');
              if (!brand || document.getElementById('theme-toggle')) return;

              const button = document.createElement('button');
              button.id = 'theme-toggle';
              button.className = 'theme-toggle';
              button.type = 'button';
              button.title = '切换主题';
              button.addEventListener('click', () => {
                const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                try {
                  localStorage.setItem(key, next);
                } catch (_) {}
              });

              brand.appendChild(button);
              applyTheme(root.dataset.theme || 'light');
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', addToggle);
            } else {
              addToggle();
            }
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          if not p.exists():
              raise SystemExit("ERROR: www/index.html not found")

          html = p.read_text(encoding="utf-8")

          css = '<link rel="stylesheet" href="ui-redesign.css">'
          js = '<script src="ui-redesign.js"></script>'

          if css not in html:
              if "</head>" not in html.lower():
                  raise SystemExit("ERROR: cannot find </head> in index.html")
              pos = html.lower().rfind("</head>")
              html = html[:pos] + css + "\n" + html[pos:]

          if js not in html:
              if "</body>" not in html.lower():
                  raise SystemExit("ERROR: cannot find </body> in index.html")
              pos = html.lower().rfind("</body>")
              html = html[:pos] + js + "\n" + html[pos:]

          p.write_text(html, encoding="utf-8")
          print("UI redesign files and links added.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/inappbrowser@2.5.5
          npm install --save-dev esbuild
          npx esbuild www/app-bridge.js --bundle --format=esm --platform=browser --outfile=www/app-bridge.bundle.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          new = 'src="/app-bridge.bundle.js"'
          s, count = re.subn(r'''src=(["'])/?app-bridge\.js\1''', new, s)
          if count == 0:
              tag = '<script type="module" src="/app-bridge.bundle.js"></script>'
              if "</head>" in s:
                  s = s.replace("</head>", tag + "</head>", 1)
              else:
                  s = tag + s
              print("index.html 中没有找到 app-bridge.js 引用，已自动插入打包后的脚本")
          else:
              print("已切换到打包后的 app-bridge.bundle.js")
          p.write_text(s, encoding="utf-8")
          PY
          npx cap init "聚搜" com.jusou.app --web-dir=www
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()
          s, count = re.subn(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 26',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("ERROR: 无法定位 minSdkVersion，请检查 android/variables.gradle")
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jusou-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
