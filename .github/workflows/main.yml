name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e

          if [ ! -f jusou-android-project.zip ]; then
            echo "ERROR: jusou-android-project.zip not found"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted www
          unzip -oq jusou-android-project.zip -d extracted

          INDEX_PATH="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found inside ZIP"
            echo "Files extracted from ZIP:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          WEB_DIR="$(dirname "$INDEX_PATH")"
          echo "Website entry: $INDEX_PATH"

          cp -a "$WEB_DIR"/. www/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "聚搜" com.jusou.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jusou-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
