name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/in-app-search-navigation

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare website files
        run: |
          set -e

          if [ ! -f jusou-android-project.zip ]; then
            echo "ERROR: jusou-android-project.zip not found"
            exit 1
          fi

          sudo apt-get update
          sudo apt-get install -y unzip

          mkdir -p extracted www
          unzip -oq jusou-android-project.zip -d extracted

          INDEX_PATH="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX_PATH" ]; then
            echo "ERROR: index.html not found inside ZIP"
            echo "Files extracted from ZIP:"
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          WEB_DIR="$(dirname "$INDEX_PATH")"
          echo "Website entry: $INDEX_PATH"

          cp -a "$WEB_DIR"/. www/

      - name: Inspect search navigation source
        run: |
          echo "=== Navigation-related matches ==="
          grep -RniE 'JUSOU_NATIVE_OPEN|function openUrl|function open\(|Browser\.open' www || true
          echo "=== index.html around openUrl ==="
          python3 - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(errors="replace")
          for key in ["function openUrl", "function open(", "JUSOU_NATIVE_OPEN"]:
              i = s.find(key)
              if i >= 0:
                  print("\n---", key, "---")
                  print(s[max(0, i-500):i+1800])
          PY
          echo "=== bridge files ==="
          find www -type f \( -name '*bridge*' -o -name '*capacitor*' \) -print

          echo "=== 查找清空按钮的真实位置 ==="
          python3 - <<'PY'
          from pathlib import Path
          import re

          s = Path("www/index.html").read_text(
              encoding="utf-8",
              errors="replace"
          )

          for m in re.finditer("清空", s):
              i = m.start()
              print("\n--- 清空按钮附近的 HTML ---")
              print(s[max(0, i-350):i+350])
          PY

      - name: Replace external browser bridge
        run: |
          set -e
          cat > www/app-bridge.js <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { InAppBrowser, DefaultWebViewOptions } from '@capacitor/inappbrowser';

          if (Capacitor.isNativePlatform()) {
            window.JUSOU_NATIVE_OPEN = async (url) => {
              if (!url) return;

              try {
                const parsed = new URL(url);
                if (!['https:', 'http:'].includes(parsed.protocol)) return;

                await InAppBrowser.openInWebView({
                  url: parsed.href,
                  options: DefaultWebViewOptions
                });
              } catch (e) {
                console.error('聚搜打开站内浏览页失败', e);
              }
            };
          }
          EOF

      - name: Apply modern UI redesign
        run: |
          set -e

          cat > www/ui-redesign.css <<'CSS'
          :root {
            color-scheme: light;
            --bg: #f4f6fb;
            --card: #ffffff;
            --txt: #202943;
            --sub: #7d879d;
            --line: #e7ebf4;
            --acc: #526df5;
            --acc2: #7c5cfa;
            --shadow: 0 5px 20px rgba(36, 53, 99, .07);
            --soft: #edf1ff;
            --glass: rgba(255, 255, 255, .62);
            --glass-line: rgba(255, 255, 255, .78);
            --glass-shadow: 0 10px 30px rgba(40, 60, 120, .16);
            --glow1: rgba(110, 145, 255, .34);
            --glow2: rgba(170, 125, 255, .22);
            --fs: 1;
            --lift: max(env(safe-area-inset-bottom, 0px), 14px);
          }

          :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #10141e;
            --card: #1a2130;
            --txt: #eef2ff;
            --sub: #a0abc1;
            --line: #2c3548;
            --acc: #8ca0ff;
            --acc2: #ad91ff;
            --shadow: 0 6px 22px rgba(0, 0, 0, .18);
            --soft: #252e48;
            --glass: rgba(30, 38, 56, .58);
            --glass-line: rgba(255, 255, 255, .10);
            --glass-shadow: 0 10px 30px rgba(0, 0, 0, .45);
            --glow1: rgba(90, 120, 255, .26);
            --glow2: rgba(150, 100, 255, .16);
          }

          * {
            box-sizing: border-box;
          }

          html {
            background: var(--bg) !important;
            scroll-behavior: smooth;
          }

          body {
            margin: 0;
            background:
              radial-gradient(120% 70% at 12% -8%, var(--glow1), transparent 62%) top / 100% 440px no-repeat,
              radial-gradient(90% 55% at 105% 2%, var(--glow2), transparent 58%) top / 100% 440px no-repeat,
              var(--bg) !important;
            color: var(--txt) !important;
            padding-bottom: 0 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
              "Noto Sans SC", "Microsoft YaHei", sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: color .2s;
          }

          .page {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 18px 16px calc(var(--lift) + 112px) !important;
          }

          header {
            margin-bottom: 20px;
          }

          .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            color: var(--txt) !important;
          }

          .logo {
            width: 46px;
            height: 46px;
            flex-shrink: 0;
            border-radius: 15px !important;
            box-shadow: 0 5px 14px rgba(82, 109, 245, .23);
          }

          .brand h1, h1 {
            color: var(--txt) !important;
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -.6px;
          }

          .sub {
            color: var(--sub) !important;
            font-size: 12px;
            line-height: 1.7;
          }

          .theme-toggle {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            margin-left: auto;
            padding: 0;
            border: 1px solid var(--glass-line);
            border-radius: 15px;
            background: var(--glass);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            color: var(--txt);
            font-size: 21px;
            box-shadow: var(--shadow);
          }

          .bar {
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 60px;
            padding: 7px 8px !important;
            border: 1px solid var(--glass-line) !important;
            border-radius: 999px !important;
            background: var(--glass) !important;
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            backdrop-filter: blur(18px) saturate(170%);
            box-shadow: var(--glass-shadow) !important;
          }

          #engbtn, .engbtn {
            flex-shrink: 0;
            border-radius: 14px !important;
          }

          /* 恢复原本的 #kw 样式 */
          #kw {
            min-width: 0;
            flex: 1;
            height: 44px;
            padding: 0 8px !important;
            border: 0 !important;
            outline: none;
            background: transparent !important;
            color: var(--txt) !important;
            font-size: 15px;
            box-shadow: none !important;
          }

          #kw:focus {
            outline: none;
          }

          /* 恢复原本的 #clr 样式 */
          #clr {
            flex-shrink: 0;
          }

          #go, .go {
            min-width: 66px;
            height: 44px;
            flex-shrink: 0;
            padding: 0 18px !important;
            border: 0 !important;
            border-radius: 999px !important;
            background: linear-gradient(135deg, var(--acc), var(--acc2)) !important;
            color: #fff !important;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(82, 109, 245, .22);
          }

          #tabs, .tabs {
            display: flex;
            gap: 8px;
            margin: 18px 0 16px;
            padding: 4px 0 7px;
            overflow-x: auto;
            scrollbar-width: none;
          }

          #tabs::-webkit-scrollbar, .tabs::-webkit-scrollbar {
            display: none;
          }

          .tab, .chip {
            flex-shrink: 0;
            border: 1px solid var(--line) !important;
            border-radius: 13px !important;
            background: var(--card) !important;
            color: var(--sub) !important;
            transition: background .15s, color .15s;
          }

          .tab.act, .tab.active, .tab.on, .chip.active, .chip.on,
          .tab[aria-selected="true"] {
            border-color: transparent !important;
            background: linear-gradient(135deg, var(--acc), var(--acc2)) !important;
            color: #fff !important;
            font-weight: 700;
          }

          .tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 8px 0 13px;
          }

          #cnt {
            color: var(--sub);
            font-size: 12px;
          }

          #add, .addbtn {
            border: 1px solid var(--line) !important;
            border-radius: 12px !important;
            background: var(--card) !important;
            color: var(--acc) !important;
            font-size: 13px;
            font-weight: 700;
          }

          .grid {
            display: grid !important;
            grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            gap: 12px !important;
            align-items: stretch;
          }

          /* 搜索框聚焦效果 */
          #kw:focus {
            box-shadow: 0 0 0 3px rgba(82, 109, 245, .14) !important;
            border-radius: 10px;
          }

          /* 搜索卡片图标细节 */
          .ico {
            border: 1px solid var(--line);
            background: linear-gradient(145deg, var(--soft), var(--card)) !important;
          }

          /* 长名称最多显示两行 */
          .nm {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            overflow-wrap: anywhere;
          }

          /* 底部导航排列更整齐 */
          .tb {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
          }

          .card {
            position: relative;
            display: flex;
            min-width: 0;
            min-height: 116px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 16px 6px 13px !important;
            overflow: hidden;
            border: 1px solid var(--line) !important;
            border-radius: 19px !important;
            background: var(--card) !important;
            color: var(--txt) !important;
            box-shadow: var(--shadow) !important;
            transition: transform .15s, border-color .15s;
          }

          .card:active {
            transform: scale(.97);
          }

          .ico {
            display: grid;
            place-items: center;
            width: 49px;
            height: 49px;
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 16px !important;
            background: var(--soft);
          }

          .ico img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 13px;
          }

          /* 图标加载失败时显示的文字，底色是浅色，文字不能再用白色 */
          .ico em {
            color: var(--acc);
            font-weight: 700;
          }

          .nm {
            width: 100%;
            overflow-wrap: anywhere;
            color: var(--txt) !important;
            font-size: 13px;
            font-weight: 650;
            line-height: 1.4;
            text-align: center;
          }

          .nm small {
            color: var(--sub) !important;
            font-size: 11px;
            font-weight: 400;
          }

          .star {
            position: absolute;
            top: 5px;
            right: 7px;
            z-index: 1;
            font-size: 15px;
          }

          .card button, .card .del, .card .edit {
            max-width: 100%;
          }

          #settings, .sheet {
            border-color: var(--line) !important;
            border-radius: 22px !important;
            background: var(--card) !important;
            color: var(--txt) !important;
            box-shadow: var(--shadow);
          }

          .sheet {
            padding: 22px !important;
          }

          .ipt, input, select, textarea {
            max-width: 100%;
            border: 1px solid var(--line) !important;
            border-radius: 13px !important;
            background: var(--bg) !important;
            color: var(--txt) !important;
            outline-color: var(--acc);
          }

          input, select, textarea {
            padding: 11px 12px;
          }

          button {
            transition: transform .12s, opacity .12s;
            cursor: pointer;
          }

          button:active {
            opacity: .85;
          }

          .mitem {
            border-color: var(--line) !important;
            border-radius: 14px !important;
            background: var(--card) !important;
            color: var(--txt) !important;
          }

          .mask {
            background: rgba(10, 16, 32, .56) !important;
            backdrop-filter: blur(5px);
          }

          /* 底部导航栏：玻璃悬浮胶囊。z-index 要低于弹窗，否则会盖住弹窗里的按钮 */
          .tabbar {
            position: fixed;
            z-index: 8;
            right: 18px;
            bottom: calc(var(--lift) + 8px);
            left: 18px;
            display: flex;
            justify-content: space-around;
            gap: 4px;
            max-width: 460px;
            margin: 0 auto;
            padding: 5px !important;
            border: 1px solid var(--glass-line) !important;
            border-radius: 28px !important;
            background: var(--glass) !important;
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            backdrop-filter: blur(24px) saturate(180%);
            box-shadow: var(--glass-shadow);
          }

          .tb {
            flex: 1;
            min-width: 0;
            min-height: 48px;
            padding: 6px 2px !important;
            border: 0 !important;
            border-radius: 22px !important;
            background: transparent !important;
            color: var(--sub) !important;
            font-size: 12px;
            text-align: center;
            transition: background .2s, color .2s;
          }

          .tb.active, .tb.on, .tb[aria-current="page"] {
            background: var(--soft) !important;
            color: var(--acc) !important;
            font-weight: 700;
          }

          .top {
            bottom: calc(var(--lift) + 84px) !important;
            border-color: var(--glass-line) !important;
            background: var(--glass) !important;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
          }

          .toast {
            bottom: calc(var(--lift) + 84px) !important;
          }

          .desc, .hint, label, h2, h3, p {
            color: var(--txt);
          }

          ::placeholder {
            color: var(--sub) !important;
            opacity: .8;
          }

          @media (min-width: 520px) {
            .page {
              padding: 24px 22px calc(var(--lift) + 112px) !important;
            }

            .grid {
              grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
              gap: 14px !important;
            }

            .card {
              min-height: 126px;
            }
          }

          @media (min-width: 700px) {
            .grid {
              grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
            }
          }

          @media (max-width: 360px) {
            .page {
              padding-right: 11px !important;
              padding-left: 11px !important;
            }

            .grid {
              gap: 8px !important;
            }

            .card {
              min-height: 105px;
              padding: 12px 4px !important;
              border-radius: 16px !important;
            }

            .ico {
              width: 43px;
              height: 43px;
            }

            #go, .go {
              min-width: 56px;
              padding: 0 13px !important;
            }
          }

          /* 追加：搜索按钮：更鲜明的渐变 */
          #go, .go {
            background: linear-gradient(135deg, #647cf8, #9270f8) !important;
            box-shadow: 0 5px 14px rgba(92, 105, 235, .28) !important;
          }

          /* 追加：首页卡片：更明显的圆角、层次和细边框 */
          .card {
            border: 1px solid rgba(130, 145, 190, .20) !important;
            border-radius: 22px !important;
            background: linear-gradient(
              155deg,
              var(--card),
              color-mix(in srgb, var(--soft) 38%, var(--card))
            ) !important;
            box-shadow: 
              0 5px 16px rgba(40, 55, 100, .06),
              inset 0 1px 0 rgba(255, 255, 255, .7) !important;
          }

          /* 追加：图标底座：与卡片形成视觉区分 */
          .ico {
            border: 0 !important;
            border-radius: 17px !important;
            background: linear-gradient(145deg, #e7ecff, #f6eaff) !important;
          }

          /* 追加：底部当前页面：玻璃上的半透明高亮 */
          .tb.active, .tb.on, .tb[aria-current="page"] {
            background: rgba(82, 109, 245, .16) !important;
            color: #4e65e8 !important;
            font-weight: 750;
          }

          /* 追加：深色模式下单独调整卡片质感 */
          :root[data-theme="dark"] .card {
            background: linear-gradient(155deg, #202a3c, #1a2130) !important;
            box-shadow: 
              0 6px 18px rgba(0, 0, 0, .18),
              inset 0 1px 0 rgba(255, 255, 255, .035) !important;
          }

          :root[data-theme="dark"] .ico {
            background: linear-gradient(145deg, #303d60, #302747) !important;
          }

          :root[data-theme="dark"] .tb.active,
          :root[data-theme="dark"] .tb.on,
          :root[data-theme="dark"] .tb[aria-current="page"] {
            background: rgba(140, 160, 255, .22) !important;
            color: #b4c0ff !important;
          }

          /* 追加：字体大小（设置里可调）。放在最后，覆盖前面的固定字号 */
          .brand h1, h1 { font-size: calc(23px * var(--fs)); }
          .sub { font-size: calc(12px * var(--fs)); }
          #kw { font-size: calc(15px * var(--fs)); }
          #go, .go { font-size: calc(14px * var(--fs)); }
          .tab { font-size: calc(12.5px * var(--fs)); }
          .chip { font-size: calc(12px * var(--fs)); }
          #cnt { font-size: calc(12px * var(--fs)); }
          #add, .addbtn { font-size: calc(13px * var(--fs)); }
          .nm { font-size: calc(13px * var(--fs)); }
          .nm small { font-size: calc(11px * var(--fs)); }
          .mitem { font-size: calc(14px * var(--fs)); }
          .mitem span { font-size: calc(12px * var(--fs)); }
          .tb { font-size: calc(12px * var(--fs)); }
          .hint { font-size: calc(11px * var(--fs)); }
          .hint.on { height: calc(17px * var(--fs)); }
          .hist.on { height: calc(31px * var(--fs)); }
          .tip { font-size: calc(11px * var(--fs)); }
          .help { font-size: calc(13px * var(--fs)); }
          .sheet h3 { font-size: calc(16px * var(--fs)); }
          .acts button { font-size: calc(15px * var(--fs)); }
          .scat { font-size: calc(12px * var(--fs)); }
          .ipt { font-size: calc(14px * var(--fs)); }
          footer { font-size: calc(11px * var(--fs)); }
          CSS

          cat > www/ui-redesign.js <<'JS'
          (() => {
            const root = document.documentElement;
            const THEME_KEY = 'jusou_theme';
            const FS_KEY = 'jusou_fs';
            const BUILD = {
              version: '__BUILD_VER__',
              code: '__BUILD_CODE__',
              date: '__BUILD_DATE__',
              sha: '__BUILD_SHA__'
            };
            const LEVELS = [
              { name: '小', value: 0.9 },
              { name: '标准', value: 1 },
              { name: '大', value: 1.15 },
              { name: '特大', value: 1.3 }
            ];

            function readStore(key) {
              try {
                return localStorage.getItem(key);
              } catch (_) {
                return null;
              }
            }

            function writeStore(key, value) {
              try {
                localStorage.setItem(key, value);
              } catch (_) {}
            }

            function esc(s) {
              return String(s).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
              }[c]));
            }

            /* ---------- 主题 ---------- */
            function applyTheme(theme) {
              root.dataset.theme = theme;
              const button = document.getElementById('theme-toggle');

              if (button) {
                button.textContent = theme === 'dark' ? '☀' : '☾';
                button.setAttribute(
                  'aria-label',
                  theme === 'dark' ? '切换浅色模式' : '切换深色模式'
                );
                button.title = theme === 'dark' ? '切换浅色模式' : '切换深色模式';
              }

              const meta = document.querySelector('meta[name="theme-color"]');
              if (meta) {
                meta.content = theme === 'dark' ? '#10141e' : '#f4f6fb';
              }
            }

            applyTheme(readStore(THEME_KEY) || 'light');

            function addToggle() {
              const brand = document.querySelector('.brand');
              if (!brand || document.getElementById('theme-toggle')) return;

              const button = document.createElement('button');
              button.id = 'theme-toggle';
              button.className = 'theme-toggle';
              button.type = 'button';
              button.textContent = '☾';
              button.title = '切换主题';
              button.setAttribute('aria-label', '切换深色模式');

              button.addEventListener('click', () => {
                const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
                applyTheme(next);
                writeStore(THEME_KEY, next);
              });

              brand.appendChild(button);
              applyTheme(root.dataset.theme || 'light');
            }

            /* ---------- 字体大小 ---------- */
            function getFs() {
              const v = parseFloat(readStore(FS_KEY));
              return LEVELS.some((l) => l.value === v) ? v : 1;
            }

            function fsName(v) {
              const hit = LEVELS.find((l) => l.value === v);
              return hit ? hit.name : '标准';
            }

            function applyFs(v) {
              root.style.setProperty('--fs', String(v));
              const el = document.getElementById('fs-val');
              if (el) el.textContent = fsName(v);
            }

            applyFs(getFs());

            /* ---------- 设置页：字体大小 + 应用信息 ---------- */
            function openMask(id) {
              const m = document.getElementById(id);
              if (m) m.classList.add('on');
            }

            function closeMask(id) {
              const m = document.getElementById(id);
              if (m) m.classList.remove('on');
            }

            function renderFsList() {
              const cur = getFs();
              document.getElementById('fslist').innerHTML = LEVELS.map((l) =>
                '<div class="mitem" data-fs="' + l.value + '">' + esc(l.name) +
                '<span>' + (l.value === cur ? '当前' : '') + '</span></div>'
              ).join('');
            }

            function renderInfoList() {
              const ua = navigator.userAgent || '';
              const android = (ua.match(/Android ([\d.]+)/) || [])[1];
              const chrome = (ua.match(/Chrome\/([\d.]+)/) || [])[1];
              const cap = window.Capacitor;
              const isApp = !!(cap && (cap.isNativePlatform ? cap.isNativePlatform() : cap.isNative));
              const aboutEl = document.getElementById('aboutv');
              const sites = aboutEl ? aboutEl.textContent.replace(/^共\s*/, '') : '';
              const rows = [
                ['应用名称', '聚搜'],
                ['版本', BUILD.version],
                ['版本号', BUILD.code],
                ['构建日期', BUILD.date],
                ['代码提交', BUILD.sha],
                ['运行方式', isApp ? 'App' : '网页'],
                ['系统', android ? 'Android ' + android : '未知'],
                ['内核', chrome ? 'Chrome ' + chrome : '未知'],
                ['站点数量', sites || '未知'],
                ['数据存储', '仅保存在本机']
              ];
              document.getElementById('infolist').innerHTML = rows.map((r) =>
                '<div class="mitem">' + esc(r[0]) + '<span>' + esc(r[1]) + '</span></div>'
              ).join('');
            }

            function buildSheets() {
              if (document.getElementById('fsmask')) return;

              const fs = document.createElement('div');
              fs.className = 'mask';
              fs.id = 'fsmask';
              fs.innerHTML =
                '<div class="sheet"><h3>字体大小</h3><div id="fslist"></div>' +
                '<div class="acts"><button class="c" id="fsclose" type="button">关闭</button></div></div>';

              const info = document.createElement('div');
              info.className = 'mask';
              info.id = 'infomask';
              info.innerHTML =
                '<div class="sheet"><h3>应用信息</h3><div id="infolist"></div>' +
                '<div class="acts"><button class="s" id="infoclose" type="button">知道了</button></div></div>';

              document.body.appendChild(fs);
              document.body.appendChild(info);

              fs.addEventListener('click', (e) => {
                if (e.target === fs) closeMask('fsmask');
              });
              info.addEventListener('click', (e) => {
                if (e.target === info) closeMask('infomask');
              });
              document.getElementById('fsclose').addEventListener('click', () => closeMask('fsmask'));
              document.getElementById('infoclose').addEventListener('click', () => closeMask('infomask'));
              document.getElementById('fslist').addEventListener('click', (e) => {
                const item = e.target.closest('.mitem');
                if (!item) return;
                const v = parseFloat(item.dataset.fs);
                applyFs(v);
                writeStore(FS_KEY, String(v));
                renderFsList();
              });
            }

            function addRows() {
              const set = document.getElementById('settings');
              if (!set || document.getElementById('fs-row')) return;

              const fsRow = document.createElement('div');
              fsRow.className = 'mitem';
              fsRow.id = 'fs-row';
              fsRow.innerHTML = '字体大小<span id="fs-val">' + esc(fsName(getFs())) + '</span>';

              const infoRow = document.createElement('div');
              infoRow.className = 'mitem';
              infoRow.id = 'info-row';
              infoRow.innerHTML = '应用信息<span>' + esc(BUILD.version) + '</span>';

              if (set.firstElementChild) {
                set.firstElementChild.after(fsRow);
              } else {
                set.appendChild(fsRow);
              }
              set.appendChild(infoRow);

              set.addEventListener('click', (e) => {
                const item = e.target.closest('.mitem');
                if (!item) return;
                if (item.id === 'fs-row') {
                  renderFsList();
                  openMask('fsmask');
                } else if (item.id === 'info-row') {
                  renderInfoList();
                  openMask('infomask');
                }
              });
            }

            function setup() {
              addToggle();
              buildSheets();
              addRows();
            }

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', setup);
            } else {
              setup();
            }
          })();
          JS

          RUN_NO="${GITHUB_RUN_NUMBER:-1}"
          sed -i "s/__BUILD_VER__/1.1.${RUN_NO}/; s/__BUILD_CODE__/$((RUN_NO + 2))/; s/__BUILD_DATE__/$(date -u +%Y-%m-%d)/; s/__BUILD_SHA__/${GITHUB_SHA::7}/" www/ui-redesign.js

          python3 - <<'PY'
          from pathlib import Path

          p = Path("www/index.html")
          if not p.exists():
              raise SystemExit("ERROR: www/index.html not found")

          html = p.read_text(encoding="utf-8")

          css = '<link rel="stylesheet" href="ui-redesign.css">'
          js = '<script src="ui-redesign.js"></script>'

          if css not in html:
              pos = html.lower().rfind("</head>")
              if pos < 0:
                  raise SystemExit("ERROR: cannot find </head> in index.html")
              html = html[:pos] + css + "\n" + html[pos:]

          if js not in html:
              pos = html.lower().rfind("</body>")
              if pos < 0:
                  raise SystemExit("ERROR: cannot find </body> in index.html")
              html = html[:pos] + js + "\n" + html[pos:]

          p.write_text(html, encoding="utf-8")
          print("Modern UI redesign applied.")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        env:
          JUSOU_KEYSTORE_BASE64: ${{ secrets.JUSOU_KEYSTORE_BASE64 }}
          JUSOU_KEYSTORE_PASSWORD: ${{ secrets.JUSOU_KEYSTORE_PASSWORD }}
          JUSOU_KEY_PASSWORD: ${{ secrets.JUSOU_KEY_PASSWORD }}
        run: |
          set -e
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/inappbrowser@2.5.5
          npm install --save-dev esbuild
          npx esbuild www/app-bridge.js --bundle --format=esm --platform=browser --outfile=www/app-bridge.bundle.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          new = 'src="/app-bridge.bundle.js"'
          s, count = re.subn(r'''src=(["'])/?app-bridge\.js\1''', new, s)
          if count == 0:
              tag = '<script type="module" src="/app-bridge.bundle.js"></script>'
              if "</head>" in s:
                  s = s.replace("</head>", tag + "</head>", 1)
              else:
                  s = tag + s
              print("index.html 中没有找到 app-bridge.js 引用，已自动插入打包后的脚本")
          else:
              print("已切换到打包后的 app-bridge.bundle.js")
          p.write_text(s, encoding="utf-8")
          PY
          npx cap init "聚搜" com.jusou.app --web-dir=www
          npx cap add android

          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path
          import re

          encoded = os.environ.get("JUSOU_KEYSTORE_BASE64", "").strip()
          store_pass = os.environ.get("JUSOU_KEYSTORE_PASSWORD", "")
          key_pass = os.environ.get("JUSOU_KEY_PASSWORD", "")

          if not encoded or not store_pass or not key_pass:
              raise SystemExit("ERROR: signing secrets are missing")

          try:
              keystore = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("ERROR: keystore Base64 is invalid")

          if len(keystore) < 100:
              raise SystemExit("ERROR: keystore file is too small")

          Path("android/app/jusou-release.jks").write_bytes(keystore)

          p = Path("android/app/build.gradle")
          s = p.read_text(encoding="utf-8")

          if "jusouFixed" in s:
              raise SystemExit("ERROR: signing configuration already exists")

          signing = '''
              signingConfigs {
                  jusouFixed {
                      storeFile file("jusou-release.jks")
                      storePassword System.getenv("JUSOU_KEYSTORE_PASSWORD")
                      keyAlias "jusou"
                      keyPassword System.getenv("JUSOU_KEY_PASSWORD")
                  }
              }
          '''

          s, n = re.subn(
              r'\bandroid\s*\{',
              lambda m: m.group(0) + signing,
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("ERROR: android block not found")

          s, n = re.subn(
              r'(\bbuildTypes\s*\{)',
              r'\1\n        debug {\n            signingConfig signingConfigs.jusouFixed\n        }\n',
              s,
              count=1
          )
          if n != 1:
              raise SystemExit("ERROR: buildTypes block not found")

          p.write_text(s, encoding="utf-8")
          print("Persistent APK signing configured.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          p = Path("android/app/build.gradle")
          if not p.exists():
              raise SystemExit("ERROR: android/app/build.gradle not found")

          s = p.read_text(encoding="utf-8")

          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "1"))
          next_code = run_number + 2
          next_name = f"1.1.{run_number}"

          s, code_count = re.subn(
              r'\bversionCode\s+\d+',
              f'versionCode {next_code}',
              s,
              count=1
          )

          s, name_count = re.subn(
              r'\bversionName\s+["\'][^"\']*["\']',
              f'versionName "{next_name}"',
              s,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  "ERROR: 无法自动修改版本号，请检查 android/app/build.gradle"
              )

          p.write_text(s, encoding="utf-8")
          print(f"App version updated to {next_name} (versionCode {next_code})")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/variables.gradle")
          s = p.read_text()
          s, count = re.subn(
              r'minSdkVersion\s*=\s*\d+',
              'minSdkVersion = 26',
              s,
              count=1
          )
          if count != 1:
              raise SystemExit("ERROR: 无法定位 minSdkVersion，请检查 android/variables.gradle")
          p.write_text(s)
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        env:
          JUSOU_KEYSTORE_PASSWORD: ${{ secrets.JUSOU_KEYSTORE_PASSWORD }}
          JUSOU_KEY_PASSWORD: ${{ secrets.JUSOU_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jusou-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
